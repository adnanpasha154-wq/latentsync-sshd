# GitHub Actions: builds and pushes our LatentSync image to Docker Hub.
# Triggers automatically on every push to main, or manually from the Actions tab.
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# This is a separate repo from heygem-sshd so the two builds don't interfere.
# Result: insightadnan/latentsync-sshd:latest on Docker Hub.

name: Build and Push LatentSync Image

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free up disk space (CUDA base + torch is ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            insightadnan/latentsync-sshd:latest
            insightadnan/latentsync-sshd:v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
